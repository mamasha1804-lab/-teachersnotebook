<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>English Teacher Planner</title>
<meta name="theme-color" content="#f5eaf3">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<script src="assets-1.js"></script>
<script src="assets-2.js"></script>
<script src="assets-3.js"></script>
<script>
(async function () {
  try {
    const files = ['app-1.js','app-2.js','app-3.js','app-4.js'];
    const parts = await Promise.all(files.map(async (file) => {
      const response = await fetch(file, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Не удалось загрузить ${file}: ${response.status}`);
      return response.text();
    }));
    const code = parts.join('\n');
    (0, eval)(code);
  } catch (error) {
    console.error(error);
    document.getElementById('app').innerHTML = `
      <div style="max-width:760px;margin:80px auto;padding:32px;border-radius:28px;background:#fff;box-shadow:0 16px 50px rgba(70,40,90,.12);font-family:Arial,sans-serif;color:#34204d">
        <h1 style="margin-top:0">English Teacher Planner</h1>
        <p>Не удалось запустить приложение. Обновите страницу через Ctrl+F5.</p>
        <pre style="white-space:pre-wrap;color:#9b4765">${String(error.message || error)}</pre>
      </div>`;
  }
})();
</script>
</body>
</html>
